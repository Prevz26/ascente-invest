openapi: 3.0.0
info:
  title: Ascente Investment API
  description: API documentation for the Ascente Investment Platform
  version: 1.0.0
  contact:
    name: API Support
    email: support@ascenteinvest.com

servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://api.ascenteinvest.com
    description: Production server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Authentication Schemas
    RegistrationRequest:
      type: object
      required:
        - username
        - fullname
        - email
        - password
        - confirm_password
        - country
      properties:
        username:
          type: string
        fullname:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        confirm_password:
          type: string
          format: password
        is_admin:
          type: boolean
          default: false
        country:
          type: string
          enum:
            - united states
            - canada
            - united kingdom
            # ... [other countries]

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    # Plan Schemas
    Plan:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        duration:
          type: string
        rate_of_return:
          type: number
          format: float
        status:
          type: string
        minimum:
          type: integer
        maximum:
          type: integer
        amount_to_receive:
          type: string

    # Wallet Schemas
    Wallet:
      type: object
      properties:
        id:
          type: integer
        balance:
          type: number
          format: float
        user_id:
          type: integer

    # Transaction Schemas
    Transaction:
      type: object
      properties:
        id:
          type: integer
        token:
          type: string
        previous_balance:
          type: number
        present_balance:
          type: number
        status:
          type: string
          enum: [pending, failed, success]
        blockchain_in:
          type: string
        blockchain_out:
          type: string

paths:
  # Authentication Endpoints
  /investment/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: User successfully registered
        '409':
          description: User already exists
        '422':
          description: Validation error

  /investment/login:
    post:
      tags:
        - Authentication
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully logged in
        '401':
          description: Invalid credentials

  # Profile Endpoints
  /investment/profile:
    get:
      tags:
        - Profile
      summary: Get user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
        '404':
          description: Profile not found

    patch:
      tags:
        - Profile
      summary: Update user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile updated successfully
        '400':
          description: Invalid request

  # Wallet Endpoints
  /investment/wallet:
    get:
      tags:
        - Wallet
      summary: Get wallet balance
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Wallet balance retrieved successfully
        '404':
          description: Wallet not found

  /investment/wallet/fund:
    post:
      tags:
        - Wallet
      summary: Fund wallet
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                token:
                  type: string
      responses:
        '200':
          description: Wallet funding initiated
        '400':
          description: Invalid request

  # Admin Endpoints
  /investment/admin/plan:
    post:
      tags:
        - Admin
      summary: Create investment plan
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Plan'
      responses:
        '201':
          description: Plan created successfully
        '409':
          description: Plan already exists

  /investment/admin/plans:
    get:
      tags:
        - Admin
      summary: Get all plans
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Plans retrieved successfully

  /investment/admin/plan/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      tags:
        - Admin
      summary: Get plan by ID
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Plan retrieved successfully
        '404':
          description: Plan not found

    patch:
      tags:
        - Admin
      summary: Update plan
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Plan updated successfully
        '404':
          description: Plan not found

    delete:
      tags:
        - Admin
      summary: Delete plan
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Plan deleted successfully
        '404':
          description: Plan not found

tags:
  - name: Authentication
    description: Authentication related operations
  - name: Profile
    description: User profile operations
  - name: Wallet
    description: Wallet management operations
  - name: Admin
    description: Administrative operations